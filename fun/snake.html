<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Dhiaan Dave</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--void:#000;--white:#fff;--ash:#c6c6c6;--graphite:#4d4d4d;--steel:#808080;--font-mono:'Space Mono',ui-monospace,monospace}
body{background:var(--void);color:var(--white);font-family:var(--font-mono);min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--graphite);height:48px;flex-shrink:0}
.top a{color:var(--steel);font-size:10px;text-transform:uppercase;letter-spacing:.1em;text-decoration:none}
.top a:hover{color:var(--white)}
.top .t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.hud{display:flex;gap:24px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--steel)}
.hud b{color:var(--white)}
canvas{border:1px solid var(--graphite);background:#050505;max-width:min(92vw,440px);max-height:min(60vh,440px);touch-action:none}
.msg{color:var(--ash);font-size:11px;text-transform:uppercase;letter-spacing:.1em;min-height:16px;text-align:center}
button{background:none;border:1px solid var(--graphite);color:var(--white);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:10px 22px;cursor:pointer}
button:hover{border-color:var(--white)}
</style>
</head>
<body>
<div class="top">
  <a href="../fun.html">&#8592; /fun</a>
  <span class="t">Snake</span>
  <a href="../index.html">Home</a>
</div>
<main>
  <div class="hud"><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
  <canvas id="c" width="440" height="440"></canvas>
  <div class="msg" id="m">Arrow keys, WASD or swipe to start</div>
  <button id="r" style="display:none">Play again</button>
</main>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=22,S=c.width/N;
let snake,dir,next,food,score,best=+localStorage.getItem('snake-best')||0,alive,tick;
document.getElementById('b').textContent=best;
function reset(){snake=[{x:11,y:11},{x:10,y:11},{x:9,y:11}];dir={x:1,y:0};next=dir;score=0;alive=true;place();document.getElementById('s').textContent=0;document.getElementById('m').textContent='';document.getElementById('r').style.display='none';if(tick)clearInterval(tick);tick=setInterval(step,110)}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y))return die();
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score+=10;document.getElementById('s').textContent=score;place()}else snake.pop();draw()}
function die(){alive=false;clearInterval(tick);
if(score>best){best=score;localStorage.setItem('snake-best',best);document.getElementById('b').textContent=best}
document.getElementById('m').textContent='Game over. Score '+score;
document.getElementById('r').style.display=''}
function draw(){x.fillStyle='#050505';x.fillRect(0,0,c.width,c.height);
x.fillStyle='#c6c6c6';x.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);
snake.forEach((p,i)=>{x.fillStyle=i===0?'#fff':'#808080';x.fillRect(p.x*S+1,p.y*S+1,S-2,S-2)})}
function turn(dx,dy){if(!alive)return;if(dir.x===-dx&&dir.y===-dy)return;next={x:dx,y:dy}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
if(k==='arrowup'||k==='w')turn(0,-1);if(k==='arrowdown'||k==='s')turn(0,1);
if(k==='arrowleft'||k==='a')turn(-1,0);if(k==='arrowright'||k==='d')turn(1,0)});
let tx,ty;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
document.getElementById('r').onclick=reset;reset();draw();
</script>
</body>
</html>

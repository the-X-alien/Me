<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser — Dhiaan Dave</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="URL Browser tool — browse any website inside an embedded iframe browser on Dhiaan Dave's portfolio page.">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--void:#000;--white:#fff;--graphite:#4d4d4d;--steel:#808080;--ash:#c6c6c6;--surface:#111;--card:#181818;--font-mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--text-xs:10px;--text-sm:12px;--sp-4:4px;--sp-6:6px;--sp-8:8px;--sp-10:10px;--sp-12:12px;--sp-16:16px;--radius-sm:4px}
body{background:var(--void);color:var(--white);font-family:var(--font-mono);height:100vh;display:flex;flex-direction:column;font-size:var(--text-sm)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--graphite);border-radius:2px}
a{color:inherit;text-decoration:none}

/* Top bar */
.top-bar{display:flex;align-items:center;gap:var(--sp-8);padding:var(--sp-8) var(--sp-10);border-bottom:1px solid var(--graphite);flex-shrink:0}
.top-bar a{color:var(--steel);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;transition:color .2s}
.top-bar a:hover{color:var(--white)}
.browser-title{color:var(--steel);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0;margin-right:var(--sp-4)}

/* Tab bar */
.tab-bar{display:flex;gap:2px;padding:var(--sp-6) var(--sp-8);border-bottom:1px solid var(--graphite);flex-shrink:0;overflow-x:auto;min-height:32px;align-items:flex-end}
.tab{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-8);background:var(--surface);border:1px solid var(--graphite);border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;font-size:var(--text-xs);color:var(--steel);white-space:nowrap;max-width:160px;transition:background .2s,color .2s}
.tab.active{background:var(--card);color:var(--white);border-color:var(--ash)}
.tab .tab-close{margin-left:var(--sp-4);color:var(--graphite);font-size:10px;cursor:pointer;padding:0 2px;transition:color .2s}
.tab .tab-close:hover{color:var(--white)}
.tab-new{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--graphite);border-radius:var(--radius-sm);cursor:pointer;color:var(--steel);font-size:var(--text-sm);transition:border-color .2s,color .2s;margin-left:var(--sp-4)}
.tab-new:hover{border-color:var(--white);color:var(--white)}

/* URL bar */
.url-bar{display:flex;align-items:center;gap:var(--sp-6);padding:var(--sp-6) var(--sp-8);border-bottom:1px solid var(--graphite);flex-shrink:0;flex-wrap:wrap}
.nav-btn{background:transparent;border:1px solid var(--graphite);border-radius:var(--radius-sm);color:var(--steel);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:var(--text-sm);transition:border-color .2s,color .2s;flex-shrink:0}
.nav-btn:hover{border-color:var(--white);color:var(--white)}
.nav-btn:disabled{opacity:.3;cursor:default}
.url-input-wrap{flex:1;display:flex;min-width:0}
.url-input-wrap input{width:100%;background:var(--surface);border:1px solid var(--graphite);border-radius:var(--radius-sm);padding:var(--sp-6) var(--sp-8);color:var(--white);font-family:var(--font-mono);font-size:var(--text-xs);outline:none;transition:border-color .2s}
.url-input-wrap input:focus{border-color:var(--ash)}
.url-input-wrap input::placeholder{color:var(--steel)}
.go-btn{font-family:var(--font-mono);font-size:var(--text-xs);background:transparent;border:1px solid var(--graphite);border-radius:var(--radius-sm);color:var(--ash);padding:var(--sp-4) var(--sp-12);cursor:pointer;text-transform:uppercase;letter-spacing:.08em;transition:border-color .2s,color .2s;flex-shrink:0}
.go-btn:hover{border-color:var(--white);color:var(--white)}
.go-btn:disabled{opacity:.3;cursor:default}

.loading-indicator{height:2px;background:var(--void);flex-shrink:0;transition:height .2s}
.loading-indicator.active{height:2px;background:linear-gradient(90deg,var(--void),var(--ash),var(--void));background-size:200% 100%;animation:shimmer .8s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Content area */
.content-area{flex:1;position:relative;background:var(--void)}
.content-area iframe{width:100%;height:100%;border:none;background:#fff}
.start-page{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-12);padding:var(--sp-20)}
.start-page .big-icon{font-size:32px;color:var(--graphite);font-family:var(--font-mono)}
.start-page p{font-size:var(--text-xs);color:var(--graphite);text-transform:uppercase;letter-spacing:.12em}

.bm-bar{display:flex;gap:6px;padding:4px 8px;border-bottom:1px solid var(--graphite);flex-shrink:0;overflow-x:auto;min-height:26px;align-items:center}
.bm{font-size:var(--text-xs);color:var(--steel);border:1px solid var(--graphite);border-radius:var(--radius-sm);padding:2px 8px;cursor:pointer;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;background:none;font-family:var(--font-mono)}
.bm:hover{color:var(--white);border-color:var(--white)}
.bm-empty{font-size:var(--text-xs);color:var(--graphite)}
.badge{font-size:var(--text-xs);color:var(--steel);border:1px solid var(--graphite);border-radius:var(--radius-sm);padding:4px 8px;flex-shrink:0;white-space:nowrap}
.panel{position:absolute;inset:0;background:var(--void);overflow:auto;padding:16px;z-index:5}
.panel h2{font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.1em;color:var(--ash);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.panel .row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--surface);font-size:var(--text-xs);cursor:pointer;color:var(--steel)}
.panel .row:hover{color:var(--white)}
.panel .row .t{color:var(--graphite);flex-shrink:0}
.content-area iframe.hidden{display:none}
.nav-btn.on{color:#ffd60a;border-color:#ffd60a}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">&#8592; Home</a>
  <span class="browser-title">Browser</span>
  <div style="flex:1"></div>
  <span class="badge" id="blockedBadge" title="Ads/trackers/popups blocked in this tab">0 blocked</span>
  <button class="go-btn" id="histBtn" title="History (Alt+H)">History</button>
</div>

<div class="tab-bar" id="tabBar">
  <div class="tab-new" id="newTabBtn" title="New tab (Alt+T)">+</div>
</div>

<div class="url-bar">
  <button class="nav-btn" id="backBtn" title="Back (Alt+Left)" disabled>&#8592;</button>
  <button class="nav-btn" id="fwdBtn" title="Forward (Alt+Right)" disabled>&#8594;</button>
  <button class="nav-btn" id="refreshBtn" title="Reload (Alt+R)">&#x21BB;</button>
  <div class="url-input-wrap">
    <input type="text" id="urlInput" placeholder="Search or enter URL... (Alt+L)" spellcheck="false" autocomplete="off">
  </div>
  <button class="nav-btn" id="starBtn" title="Bookmark this page (Alt+D)">&#9734;</button>
  <button class="go-btn" id="goBtn">Go</button>
  <button class="go-btn" id="popoutBtn" title="Open in real browser tab" style="font-size:14px;padding:var(--sp-4) var(--sp-8)">&#x2197;</button>
</div>

<div class="bm-bar" id="bmBar"></div>
<div class="loading-indicator" id="loadingIndicator"></div>

<div class="content-area" id="contentArea">
  <div class="start-page" id="startPage">
    <div class="big-icon">&#x2315;</div>
    <p>Enter a URL or search term above</p>
  </div>
  <div class="panel" id="histPanel" style="display:none"></div>
</div>

<script>
// === State ===
var tabs = [], activeTabId = null, tabCounter = 0;
var LS = window.localStorage;
function load(k, d) { try { return JSON.parse(LS.getItem(k)) || d; } catch (e) { return d; } }
function save(k, v) { try { LS.setItem(k, JSON.stringify(v)); } catch (e) {} }
var bookmarks = load('br_bookmarks', []);
var historyLog = load('br_history', []);

var $ = function (id) { return document.getElementById(id); };
var area = $('contentArea'), startPage = $('startPage'), histPanel = $('histPanel');

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getActiveTab() { return tabs.find(function (t) { return t.id === activeTabId; }); }

// === Tabs ===
function createTab(url) {
  var id = ++tabCounter;
  tabs.push({ id: id, url: '', title: 'New Tab', history: [], idx: -1, iframe: null, blocked: 0 });
  activateTab(id);
  if (url) navigate(id, url);
  return id;
}
function activateTab(id) {
  activeTabId = id;
  hideHistory();
  renderTabs();
  showActive();
}
function closeTab(id) {
  var i = tabs.findIndex(function (t) { return t.id === id; });
  if (i < 0) return;
  var t = tabs[i];
  if (t.iframe) t.iframe.remove();
  tabs.splice(i, 1);
  if (!tabs.length) { createTab(''); return; }
  if (activeTabId === id) activateTab(tabs[Math.min(i, tabs.length - 1)].id);
  else renderTabs();
}
function renderTabs() {
  var bar = $('tabBar'), nb = $('newTabBtn');
  bar.innerHTML = '';
  tabs.forEach(function (t) {
    var d = document.createElement('div');
    d.className = 'tab' + (t.id === activeTabId ? ' active' : '');
    d.textContent = t.title.length > 20 ? t.title.slice(0, 20) + '...' : t.title;
    d.title = t.title;
    d.addEventListener('click', function () { activateTab(t.id); });
    d.addEventListener('auxclick', function (e) { if (e.button === 1) closeTab(t.id); });
    var c = document.createElement('span');
    c.className = 'tab-close'; c.textContent = '\u2715';
    c.addEventListener('click', function (e) { e.stopPropagation(); closeTab(t.id); });
    d.appendChild(c);
    bar.appendChild(d);
  });
  bar.appendChild(nb);
  updateUI();
}
// Show the active tab's iframe, hide the others (iframes stay alive, no reload on tab switch)
function showActive() {
  var t = getActiveTab();
  tabs.forEach(function (x) { if (x.iframe) x.iframe.classList.toggle('hidden', x !== t); });
  startPage.style.display = (!t || !t.iframe) ? 'flex' : 'none';
  $('urlInput').value = t ? t.url : '';
  updateUI();
}
function updateUI() {
  var t = getActiveTab();
  $('backBtn').disabled = !t || t.idx <= 0;
  $('fwdBtn').disabled = !t || t.idx >= t.history.length - 1;
  $('blockedBadge').textContent = (t ? t.blocked : 0) + ' blocked';
  var on = t && t.url && bookmarks.some(function (b) { return b.url === t.url; });
  $('starBtn').classList.toggle('on', !!on);
  $('starBtn').innerHTML = on ? '&#9733;' : '&#9734;';
}

// === Navigation ===
function processUrl(input) {
  var v = input.trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return v;
  if (v.indexOf('//') === 0) return 'https:' + v;
  if (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/|$|\?)/.test(v) && v.indexOf(' ') < 0) return 'https://' + v;
  return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(v);
}
function navigate(id, input, noPush) {
  var t = tabs.find(function (x) { return x.id === id; });
  var url = processUrl(input);
  if (!t || !url) return;
  t.url = url;
  if (!noPush) {
    t.history = t.history.slice(0, t.idx + 1);
    t.history.push(url);
    t.idx = t.history.length - 1;
  }
  loadTab(t);
}
function loadTab(t) {
  hideHistory();
  t.blocked = 0;
  if (!t.iframe) {
    var f = document.createElement('iframe');
    // no allow-popups: blocks ad popups; link clicks are handled by our nav script
    f.sandbox = 'allow-scripts allow-forms';
    t.iframe = f;
    area.appendChild(f);
  }
  t.title = t.url;
  setLoading(true);
  $('urlInput').value = t.url;
  renderTabs();
  showActive();
  var iframe = t.iframe, wantUrl = t.url;
  fetch('/api/proxy?url=' + encodeURIComponent(t.url))
    .then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
      var n = parseInt(r.headers.get('X-Blocked-Count') || '0', 10);
      return r.text().then(function (html) { return { html: html, n: n }; });
    })
    .then(function (o) {
      if (t.url !== wantUrl) return;
      t.blocked = o.n;
      iframe.srcdoc = o.html;
      var m = o.html.match(/<title[^>]*>([^<]+)<\/title>/i);
      t.title = m ? m[1].trim() : t.url;
      setLoading(false);
      logHistory(t.url, t.title);
      renderTabs();
    })
    .catch(function (err) {
      setLoading(false);
      t.title = 'Error';
      iframe.srcdoc = '<div style="padding:24px;font-family:sans-serif;color:#f44336;background:#111"><h2>Could not load page</h2><p style="color:#999">' + esc(err.message) + '</p><p style="color:#777;font-size:13px">Some sites only work in a real tab (use the arrow button).</p></div>';
      renderTabs();
    });
}
function setLoading(on) { $('loadingIndicator').className = 'loading-indicator' + (on ? ' active' : ''); }
function go() {
  var v = $('urlInput').value.trim();
  if (!v) return;
  var id = activeTabId || createTab('');
  navigate(id, v);
  $('urlInput').blur();
}
function goBack() { var t = getActiveTab(); if (t && t.idx > 0) { t.idx--; t.url = t.history[t.idx]; loadTab(t); } }
function goForward() { var t = getActiveTab(); if (t && t.idx < t.history.length - 1) { t.idx++; t.url = t.history[t.idx]; loadTab(t); } }
function refresh() { var t = getActiveTab(); if (t && t.url) loadTab(t); }

// Messages from proxied pages
window.addEventListener('message', function (e) {
  var d = e.data;
  if (!d || typeof d !== 'object') return;
  var src = tabs.find(function (t) { return t.iframe && t.iframe.contentWindow === e.source; });
  if (!src) return;
  if (d.nav) {
    if (d.newtab) createTab(d.nav); else navigate(src.id, d.nav);
  } else if (typeof d.blocked === 'number') {
    src.blocked += 1;
    if (src.id === activeTabId) updateUI();
  }
});

// === History ===
function logHistory(url, title) {
  historyLog = historyLog.filter(function (h) { return h.url !== url; });
  historyLog.unshift({ url: url, title: title, t: Date.now() });
  historyLog = historyLog.slice(0, 200);
  save('br_history', historyLog);
}
function showHistory() {
  var h = '<h2><span>History</span><button class="go-btn" id="clrHist">Clear</button></h2>';
  if (!historyLog.length) h += '<div class="row">Nothing yet</div>';
  historyLog.forEach(function (x, i) {
    h += '<div class="row" data-i="' + i + '"><span class="t">' + new Date(x.t).toLocaleString() + '</span><span>' + esc(x.title) + '</span></div>';
  });
  histPanel.innerHTML = h;
  histPanel.style.display = 'block';
  $('clrHist').onclick = function () { historyLog = []; save('br_history', []); showHistory(); };
  histPanel.querySelectorAll('.row[data-i]').forEach(function (r) {
    r.onclick = function () { navigate(activeTabId || createTab(''), historyLog[+r.dataset.i].url); };
  });
}
function hideHistory() { histPanel.style.display = 'none'; }
function toggleHistory() { if (histPanel.style.display === 'none') showHistory(); else hideHistory(); }

// === Bookmarks ===
function renderBookmarks() {
  var bar = $('bmBar');
  bar.innerHTML = '';
  if (!bookmarks.length) { bar.innerHTML = '<span class="bm-empty">No bookmarks yet. Click the star to add the current page.</span>'; return; }
  bookmarks.forEach(function (b) {
    var el = document.createElement('button');
    el.className = 'bm'; el.textContent = b.title; el.title = b.url + ' (right-click to remove)';
    el.addEventListener('click', function () { navigate(activeTabId || createTab(''), b.url); });
    el.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      bookmarks = bookmarks.filter(function (x) { return x.url !== b.url; });
      save('br_bookmarks', bookmarks); renderBookmarks(); updateUI();
    });
    bar.appendChild(el);
  });
}
function toggleBookmark() {
  var t = getActiveTab();
  if (!t || !t.url) return;
  if (bookmarks.some(function (b) { return b.url === t.url; })) bookmarks = bookmarks.filter(function (b) { return b.url !== t.url; });
  else bookmarks.push({ url: t.url, title: t.title.slice(0, 30) });
  save('br_bookmarks', bookmarks); renderBookmarks(); updateUI();
}

// === Events ===
$('urlInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
$('urlInput').addEventListener('focus', function () { this.select(); });
$('goBtn').addEventListener('click', go);
$('popoutBtn').addEventListener('click', function () { var t = getActiveTab(); if (t && t.url) window.open(t.url, '_blank', 'noopener'); });
$('backBtn').addEventListener('click', goBack);
$('fwdBtn').addEventListener('click', goForward);
$('refreshBtn').addEventListener('click', refresh);
$('newTabBtn').addEventListener('click', function () { createTab(''); $('urlInput').focus(); });
$('starBtn').addEventListener('click', toggleBookmark);
$('histBtn').addEventListener('click', toggleHistory);
// Alt-based shortcuts (Ctrl+T/W/L are reserved by the real browser)
document.addEventListener('keydown', function (e) {
  if (!e.altKey) return;
  var k = e.key.toLowerCase(), used = true;
  if (k === 't') { createTab(''); $('urlInput').focus(); }
  else if (k === 'w') closeTab(activeTabId);
  else if (k === 'l') $('urlInput').focus();
  else if (k === 'r') refresh();
  else if (k === 'd') toggleBookmark();
  else if (k === 'h') toggleHistory();
  else if (e.key === 'ArrowLeft') goBack();
  else if (e.key === 'ArrowRight') goForward();
  else used = false;
  if (used) e.preventDefault();
});

renderBookmarks();
createTab('');
</script>
</body>
</html>
